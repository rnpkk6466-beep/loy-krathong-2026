<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Magical Loy Krathong</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><style>
body{background:#0b1028;min-height:100vh}.admin{max-width:1100px;margin:auto;padding:35px 18px}.panel{background:#ffffff0b;border:1px solid #ffffff20;border-radius:16px;padding:20px;margin:18px 0}.admin h1{font-size:26px}.admin input,.admin select{background:#0b1432;color:#fff;border:1px solid #ffffff30;padding:10px;border-radius:8px;font:inherit}.login{max-width:400px;margin:12vh auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric strong{font-size:28px;color:#f1d39a;display:block}.metric small{color:#b7b8d0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}td,th{padding:10px;border-bottom:1px solid #ffffff1b;text-align:left}th{color:#e9c88f}.action{border:1px solid #e6c68d;background:#e6c68d;color:#1a1832;padding:6px 10px;border-radius:7px;cursor:pointer}.danger{background:#8e354c;color:#fff;border-color:#8e354c}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="admin"><a href="index.html" style="color:#e7c58e">← กลับหน้าเว็บไซต์</a><h1>✧ MAGICAL LOY KRATHONG — ADMIN</h1>
<section id="loginPanel" class="panel login"><h2>เข้าสู่ระบบผู้ดูแล</h2><p>กรุณาใช้รหัสผ่านผู้ดูแลระบบ</p><input id="password" type="password" placeholder="Admin password" style="width:100%"><button class="primary-btn" id="loginBtn" style="width:100%;margin-top:12px">เข้าสู่ระบบ</button><p id="loginMsg"></p></section>
<section id="dashboard" hidden><div class="grid"><div class="panel metric"><strong id="mTotal">0</strong><small>กระทงทั้งหมด</small></div><div class="panel metric"><strong id="mToday">0</strong><small>วันนี้</small></div><div class="panel metric"><strong id="mWishes">0</strong><small>คำอธิษฐาน</small></div><div class="panel metric"><strong id="mOpen">—</strong><small>สถานะลงทะเบียน</small></div></div>
<div class="panel"><h2>ตั้งค่ากิจกรรม</h2><label><input type="checkbox" id="openToggle"> เปิดรับลงทะเบียน</label>　<label><input type="checkbox" id="publicToggle"> อนุญาตแสดงคำอธิษฐาน</label>　<button class="action" id="saveSettings">บันทึกการตั้งค่า</button></div>
<div class="panel"><h2>จำนวนกระทงแยกตามประเภท</h2><div id="typeStats"></div></div>
<div class="panel"><h2>รายการลงทะเบียนล่าสุด</h2><button class="action" id="csvBtn">Export CSV</button><div class="table-wrap"><table><thead><tr><th>เวลา</th><th>ชื่อ</th><th>จังหวัด</th><th>ประเภท</th><th>คำอธิษฐาน</th><th>สถานะ</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<button class="action danger" id="logoutBtn">ออกจากระบบ</button></section></div><iframe name="gasFrame" id="gasFrame" hidden></iframe>
<script>window.MLK_CONFIG={API_URL:"https://script.google.com/macros/s/AKfycbyF2YvfdCRjk7DsyJxq_kQwsOe3hr_NYa4BOGJVbSsuf0fq9IJv3-2B1YnE3I2Cj1Ar/exec"};</script><script src="assets/js/admin.js"></script></body></html>
